kind = "mobile"
previewPath = "/streaming-bag-control/"
title = "Streaming Bag Control"
description = "A modern mobile control app for managing a streaming bag with recording controls, OBS connection, camera switching, actuator movement, visibility lighting, and voice-command interactions using realistic mock device data."
version = "1.0.0"
id = "artifacts/streaming-bag-control"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/streaming-bag-control/" ]
localPort = 19196

[services.development]
run = "pnpm --filter @workspace/streaming-bag-control run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/streaming-bag-control", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/streaming-bag-control", "run", "serve" ]

[services.env]
PORT = "19196"
BASE_PATH = "/streaming-bag-control/"
